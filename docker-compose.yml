services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posts-explorer-dev
    ports:
      - "5173:5173"
    volumes:
      # Mount source for hot reload; keep node_modules from the image
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true